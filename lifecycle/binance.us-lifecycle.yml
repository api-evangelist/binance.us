deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  practice: >-
    Binance.US does not publish a deprecation or sunset policy, and does not emit RFC 8594 Sunset/Deprecation
    headers. In practice it announces breaking changes in the docs changelog with an effective date and about
    a month of notice — the 2026-07-30 entry announced the 2026-08-31 spot exchange upgrade — and it has
    removed endpoints via dated changelog entries (Quick Enable/Disable Crypto Withdrawal on 2023-10-13,
    Credit Line order endpoints on 2023-07-20, Withdraw Fiat via SIGNET on 2023-04-03, the 1s candlestick
    interval on 2023-09-06). This is a practice, not a published contract, so no Deprecation pointer is
    emitted for this provider.
  announced_deprecations:
  - item: exchangeInfo `permissions` field
    status: emptied 2026-08-31, removal announced without a date
    replacement: permissionSets
    source: https://docs.binance.us/#changelog
  gap: >-
    A published deprecation/sunset policy with a stated notice window is the single clearest operational
    transparency gap on this provider.

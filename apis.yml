- aid: binance.us:websocket-api
  name: Binance.US WebSocket API
  description: >-
    The Binance.US WebSocket API is a request/response API delivered over a persistent WebSocket connection
    at wss://ws-api.binance.us/ws-api/v3. It is functionally equivalent to the REST API — the same parameters,
    the same status and error codes — but offers lower latency for time-sensitive trading. It covers general
    requests, market data requests, trading requests (place/test/query/cancel/replace orders and OCO),
    account requests, and user data stream lifecycle requests. SIGNED (TRADE and USER_DATA) requests use
    the same HMAC SHA-256 signature and timing rules as the REST API.
  humanURL: https://docs.binance.us/#websocket-api
  baseURL: wss://ws-api.binance.us/ws-api/v3
  image: https://public.cstatic.us/static/images/binance_previewImage.png
  tags:
  - Cryptocurrency
  - Exchange
  - Trading
  - Real-Time
  - WebSocket
  properties:
  - type: Documentation
    url: https://docs.binance.us/#websocket-api
  - type: AsyncAPI
    url: asyncapi/binance.us-websocket-api-asyncapi.yml
- aid: binance.us:websocket-streams
  name: Binance.US WebSocket Streams
  description: >-
    Binance.US WebSocket Streams deliver real-time market data and account events over persistent WebSocket
    connections at wss://stream.binance.us:9443. Market data streams include aggregate trade, raw trade,
    kline/candlestick, individual and all-market mini-ticker, 24h ticker, rolling-window statistics, book
    ticker, partial order book depth and diff depth streams. User data streams — opened with a listenKey
    from the REST API — push outboundAccountPosition, balanceUpdate, executionReport and listStatus events.
    Streams can be consumed raw at /ws/streamName or combined at /stream?streams=, with SUBSCRIBE, UNSUBSCRIBE,
    LIST_SUBSCRIPTIONS, SET_PROPERTY and GET_PROPERTY control messages.
  humanURL: https://docs.binance.us/#websocket-streams
  baseURL: wss://stream.binance.us:9443
  image: https://public.cstatic.us/static/images/binance_previewImage.png
  tags:
  - Cryptocurrency
  - Market Data
  - Real-Time
  - Streaming
  - WebSocket
  properties:
  - type: Documentation
    url: https://docs.binance.us/#websocket-streams
  - type: AsyncAPI
    url: asyncapi/binance.us-websocket-streams-asyncapi.yml

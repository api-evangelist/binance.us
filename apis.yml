apis:
- aid: binance.us:rest-api
  name: Binance.US REST API
  description: >-
    The Binance.US REST API is the primary programmatic interface to the exchange. It exposes general
    system and exchange information, market and trade data (recent/aggregate/historical trades, order
    book depth, klines, ticker and rolling-window price statistics), user account data, sub-account data,
    spot trade order management including OCO and cancel-replace, OTC quoting and order placement, wallet
    deposits and withdrawals, dust conversion, referral reward history, staking, Custodial Solution endpoints,
    Credit Line endpoints and API Partner endpoints. Public endpoints are unauthenticated; TRADE and USER_DATA
    endpoints require an API key plus an HMAC SHA-256 signature and a millisecond timestamp bounded by
    recvWindow.
  humanURL: https://docs.binance.us/#rest-api
  baseURL: https://api.binance.us
  image: https://public.cstatic.us/static/images/binance_previewImage.png
  tags:
  - Cryptocurrency
  - Exchange
  - Trading
  - Market Data
  - Wallet
  - REST

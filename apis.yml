aid: binance.us
name: Binance.US
description: >-
  Binance.US (operated by BAM Trading Services, Inc.) is a U.S.-regulated digital asset marketplace offering
  spot trading, staking, OTC and custodial services across 100+ cryptocurrencies. Its public developer
  program exposes a signed REST API at api.binance.us covering exchange and system information, market and
  trade data, user account data, spot order management (including OCO and cancel-replace), wallet deposits
  and withdrawals, dust conversion, referrals, staking, OTC quoting, Custodial Solution and Credit Line
  endpoints, plus a functionally equivalent WebSocket API and real-time WebSocket market-data and user-data
  streams. Authentication is HMAC SHA-256 request signing with an X-MBX-APIKEY header, and the platform
  publishes a full error-code registry, symbol/exchange filter rules, weighted IP and order rate limits, and
  a dated changelog in its official GitHub documentation repository.
url: https://raw.githubusercontent.com/api-evangelist/binance.us/refs/heads/main/apis.yml

matching_engine_messages:
- message: Unknown order sent
  description: The order (by orderId, clOrdId or origClOrdId) could not be found.
- message: Duplicate order sent
  description: The clOrdId is already in use.
- message: Market is closed
  description: The symbol is not trading.
- message: Account has insufficient balance for requested action
  description: Not enough funds to complete the action.
- message: Market orders are not supported for this symbol
  description: MARKET is not enabled on the symbol.
- message: Iceberg orders are not supported for this symbol
  description: icebergQty is not enabled on the symbol.
- message: Stop loss orders are not supported for this symbol
  description: STOP_LOSS is not enabled on the symbol.
- message: Stop loss limit orders are not supported for this symbol
  description: STOP_LOSS_LIMIT is not enabled on the symbol.
- message: Take profit orders are not supported for this symbol
  description: TAKE_PROFIT is not enabled on the symbol.
- message: Take profit limit orders are not supported for this symbol
  description: TAKE_PROFIT_LIMIT is not enabled on the symbol.
- message: Price * QTY is zero or less
  description: Price * quantity is too low.
- message: IcebergQty exceeds QTY
  description: icebergQty must be less than the order quantity.
- message: This action is disabled on this account
  description: Contact customer support; some actions have been disabled on the account.
- message: Unsupported order combination
  description: The orderType, timeInForce, stopPrice and/or icebergQty combination is not allowed.
- message: Order would trigger immediately
  description: The order's stop price is not valid compared to the last traded price.
- message: Cancel order is invalid. Check origClOrdId and orderId.
  description: No origClOrdId or orderId was sent.
- message: Order would immediately match and take
  description: A LIMIT_MAKER order would immediately match and trade instead of resting as a pure maker order.
- message: The relationship of the prices for the orders is not correct
  description: >-
    OCO price rules broken. SELL orders require Limit Price > Last Price > Stop Price; BUY orders require
    Limit Price < Last Price < Stop Price.
- message: OCO orders are not supported for this symbol
  description: OCO is not enabled on the symbol.
- message: Quote order qty market orders are not support for this symbol
  description: MARKET orders using quoteOrderQty are not enabled on this symbol.
- message: Trailing stop orders are not supported for this symbol.
  description: Orders using trailingDelta are not enabled on the symbol.
- message: Order cancel-replace is not supported for this symbol.
  description: POST /api/v3/order/cancelReplace is not enabled for the symbol.
- message: This symbol is not permitted for this account.
  description: Account does not have permission to trade on this symbol.
- message: This symbol is restricted for this account.
  description: Account does not have permission to trade on this symbol.
- message: Order was not canceled due to cancel restrictions.
  description: >-
    cancelRestrictions was ONLY_NEW but the order status was not NEW, or ONLY_PARTIALLY_FILLED but the order
    status was not PARTIALLY_FILLED.
filter_failures:
- message: 'Filter failure: PRICE_FILTER'
  description: Price is too high, too low, and/or not following the tick size rule for the symbol.
- message: 'Filter failure: PERCENT_PRICE'
  description: Price is X% too high or X% too low from the average weighted price over the last Y minutes.
- message: 'Filter failure: LOT_SIZE'
  description: Quantity is too high, too low, and/or not following the step size rule for the symbol.
- message: 'Filter failure: MIN_NOTIONAL'
  description: Price * Quantity is too low to be a valid order for the symbol.
- message: 'Filter failure: ICEBERG_PARTS'
  description: ICEBERG order would break into too many parts; icebergQty is too small.
- message: 'Filter failure: MARKET_LOT_SIZE'
  description: >-
    MARKET order's quantity is too high, too low, and/or not following the step size rule for the symbol.
- message: 'Filter failure: MAX_NUM_ORDERS'
  description: Account has too many open orders on the symbol.
- message: 'Filter failure: MAX_ALGO_ORDERS'
  description: Account has too many open stop loss and/or take profit orders on the symbol.
- message: 'Filter failure: MAX_NUM_ICEBERG_ORDERS'
  description: Account has too many open iceberg orders on the symbol.
- message: 'Filter failure: TRAILING_DELTA'
  description: trailingDelta is not within the defined range of the filter for that order type.
- message: 'Filter failure: EXCHANGE_MAX_NUM_ORDERS'
  description: Account has too many open orders on the exchange.
- message: 'Filter failure: EXCHANGE_MAX_ALGO_ORDERS'
  description: Account has too many open stop loss and/or take profit orders on the exchange.

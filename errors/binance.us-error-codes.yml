format: proprietary
envelope:
  media_type: application/json
  example: |
    {
      "code": -1121,
      "msg": "Invalid symbol."
    }
  fields:
  - name: code
    description: Universal negative integer error code.
  - name: msg
    description: Human-readable message. Messages can vary for the same code.
http_semantics:
- status: 400
  description: >-
    HTTP 4XX return codes are used for malformed requests; the issue is on the sender's side.
- status: 403
  description: WAF (Web Application Firewall) limit has been violated.
- status: 409
  description: >-
    A cancelReplace order partially succeeded (the cancellation failed but the new order placement succeeded).
- status: 418
  description: >-
    An IP has been auto-banned for continuing to send requests after receiving 429 codes. A Retry-After header
    gives the seconds remaining on the ban.
- status: 429
  description: A request rate limit was broken. A Retry-After header gives the back-off seconds.
- status: 500
  description: >-
    HTTP 5XX return codes are used for internal errors on the Binance.US side. Do NOT treat this as a failed
    operation — the execution status is UNKNOWN and may have succeeded.
classes:
- id: server-network
  title: Server / network errors (10xx)
  range: -1000 to -1022
- id: request
  title: Request errors (11xx / 2xxx)
  range: -1100 to -2026
- id: matching-engine
  title: Matching engine errors
  note: Message-level errors returned with -1010, -2010 and -2011.
- id: filter-failure
  title: Filter failure errors
  note: Message-level errors returned when a symbol or exchange filter rejects an order.
- id: websocket-stream
  title: WebSocket Streams control errors
  note: Positive small integer codes returned on the streams control channel.
